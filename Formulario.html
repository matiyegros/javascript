<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }

        .container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #mensaje-error {
            color: #d9534f;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }

        #mensaje-exito {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Usuario</h2>
    
    <form id="registroForm" onsubmit="return validarFormulario()">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email">
        </div>

        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Repetir contraseña:</label>
            <input type="password" id="confirmPassword">
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <div id="mensaje-error"></div>
    <div id="mensaje-exito"></div>
</div>

<script>
function validarFormulario() {
    // Obtener elementos
    var nombre = document.getElementById('nombre').value.trim();
    var apellido = document.getElementById('apellido').value.trim();
    var email = document.getElementById('email').value.trim();
    var edad = document.getElementById('edad').value.trim();
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;

    var divError = document.getElementById('mensaje-error');
    var divExito = document.getElementById('mensaje-exito');

    // Ocultar mensajes previos
    divError.style.display = 'none';
    divExito.style.display = 'none';
    divError.innerHTML = '';

    var errores = [];

    // Validar Nombre
    if (nombre === "" || nombre.length === 0) {
        errores.push("El campo 'Nombre' no puede estar vacío.");
    } else if (nombre.length < 3) {
        errores.push("El campo 'Nombre' debe tener al menos 3 caracteres.");
    }

    // Validar Apellido
    if (apellido === "" || apellido.length === 0) {
        errores.push("El campo 'Apellido' no puede estar vacío.");
    }

    // Validar Email
    if (email === "" || email.length === 0) {
        errores.push("El campo 'Email' no puede estar vacío.");
    } else if (!email.includes('@') || !email.includes('.')) {
        errores.push("El campo 'Email' debe contener '@' y un punto (.).");
    }

    // Validar Edad
    if (edad === "" || edad.length === 0) {
        errores.push("El campo 'Edad' no puede estar vacío.");
    } else {
        var edadNum = parseInt(edad);
        if (isNaN(edadNum) || edadNum < 16 || edadNum > 99) {
            errores.push("La 'Edad' debe ser un número entre 16 y 99.");
        }
    }

    // Validar Contraseña
    if (password.length < 6) {
        errores.push("La 'Contraseña' debe tener al menos 6 caracteres.");
    }

    // Validar Repetir contraseña
    if (password !== confirmPassword) {
        errores.push("Las contraseñas no coinciden.");
    }

    // Si existen errores, se muestran y se detiene el envío
    if (errores.length > 0) {
        divError.innerHTML = errores.join("<br>");
        divError.style.display = 'block';
        return false; // Evita recargar la página
    }

    // Si todo está correcto
    divExito.innerHTML = "Registro exitoso. ¡Bienvenido, " + nombre + "!";
    divExito.style.display = 'block';

    return false; // Evita la recarga de página para mostrar el mensaje de éxito
}
</script>

</body>
</html>
